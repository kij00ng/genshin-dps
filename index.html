<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원신 파티 DPS 분석</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --tx:#e6e8ec; --tx2:#9aa3b2; --tx3:#6b7382;
  --acc:#7dd3fc; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --hydro:#4fc3f7; --pyro:#ff8a65; --electro:#ba68c8; --cryo:#80deea;
  --anemo:#80cbc4; --geo:#ffd54f; --dendro:#aed581; --physical:#cfd8dc;
  --hero1:#1b2430; --hover:#1b1f27; --curRow:#1b2a33; --code:#0c0e12; --codeTx:#cfd6e0;
  --priBg:#1e3a4a; --priLine:#2b5a73; --priTx:#bae6fd;
  --warnBg:#2a2113; --warnLine:#4a3a1a; --warnTx:#fcd34d;
  --r5:#ffd79a; --r5Line:#5a4520; --r4:#d6b4ff; --r4Line:#4a3a63;
  --tl:#1b1d22; --tlTx:#cfd6e0; --miniBg:#1e2530; --miniLine:#3a4250; --miniHover:#2a3442;
  color-scheme:dark;
}
/* 밝은 테마: 기기 설정이 밝으면(또는 data-theme="light") */
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#d9dde4;
  --tx:#161a20; --tx2:#4d5664; --tx3:#7a8392;
  --acc:#0369a1; --good:#15803d; --bad:#dc2626; --warn:#b45309;
  --hero1:#e8f1f8; --hover:#eef2f6; --curRow:#e0f0fa; --code:#f7f8fa; --codeTx:#1f2630;
  --priBg:#e0f2fe; --priLine:#7cc4ec; --priTx:#075985;
  --warnBg:#fff7e6; --warnLine:#f2cf8a; --warnTx:#92400e;
  --r5:#a16207; --r5Line:#e7c77a; --r4:#7e22ce; --r4Line:#cfb0ef;
  --tl:#e6e9ee; --tlTx:#1f2630; --miniBg:#f0f2f5; --miniLine:#c9ced6; --miniHover:#e3e8ee;
  color-scheme:light;
} }
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#d9dde4;
  --tx:#161a20; --tx2:#4d5664; --tx3:#7a8392;
  --acc:#0369a1; --good:#15803d; --bad:#dc2626; --warn:#b45309;
  --hero1:#e8f1f8; --hover:#eef2f6; --curRow:#e0f0fa; --code:#f7f8fa; --codeTx:#1f2630;
  --priBg:#e0f2fe; --priLine:#7cc4ec; --priTx:#075985;
  --warnBg:#fff7e6; --warnLine:#f2cf8a; --warnTx:#92400e;
  --r5:#a16207; --r5Line:#e7c77a; --r4:#7e22ce; --r4Line:#cfb0ef;
  --tl:#e6e9ee; --tlTx:#1f2630; --miniBg:#f0f2f5; --miniLine:#c9ced6; --miniHover:#e3e8ee;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
.wrap{max-width:1560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:17px;margin:0 0 2px;font-weight:650;letter-spacing:-.2px}
.sub{color:var(--tx2);font-size:12.5px;margin-bottom:14px}

.hero{background:linear-gradient(135deg,var(--hero1),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;flex-wrap:wrap;
  gap:18px;align-items:flex-end}
.hero .big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.hero .unit{font-size:13px;color:var(--tx2);margin-left:6px;font-weight:400}
.hero .meta{color:var(--tx2);font-size:12.5px}
.hero .meta b{color:var(--tx);font-weight:600}

/* 파티 카드: 캐릭터마다 가로로 긴 줄 하나 (위아래로 네 줄). 카드는 원소색, 왼쪽 일러스트, 오른쪽 설정 칸 */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card.mc{--el:#888;display:grid;grid-template-columns:128px minmax(0,1fr);padding:0;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--el) 45%,var(--line));border-left:4px solid var(--el);
  background:linear-gradient(90deg,color-mix(in srgb,var(--el) 18%,var(--panel)) 0,var(--panel) 42%)}
/* 초상화 칸: 카드 높이에 맞춰 늘어나지 않고 위쪽에 고정 */
.mc .art{position:relative;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--el) 55%,transparent),color-mix(in srgb,var(--el) 14%,var(--panel)) 72%);
  display:flex;align-items:flex-start;justify-content:center}
.mc .art img{width:128px;height:128px;object-fit:contain;display:block}
.mc .art .ph{font-size:48px;font-weight:700;color:color-mix(in srgb,var(--el) 70%,#fff);margin:32px auto}
.mc .art .share{position:absolute;top:6px;left:6px;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--panel) 75%,transparent);color:var(--tx)}
.mc .body{padding:9px 12px;min-width:0}
.mc .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:6px}
.mc .top .who{font-weight:650;font-size:15px}
.mc .foot2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:7px;font-size:11.5px;color:var(--tx2)}
.mc .foot2 .btns{margin-top:0}
/* 파티 편성: 카드 위의 줄 + 고르기 창 (원소별 초상화, 1~4번 칸) */
.partybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.partybar .pmini{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;padding:3px 10px 3px 3px;border-radius:999px;font-size:12.5px;
  border:1px solid color-mix(in srgb,var(--el) 50%,var(--line));background:color-mix(in srgb,var(--el) 14%,var(--panel))}
.partybar .pmini img,.partybar .pmini .ph{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--el) 35%,var(--panel));object-fit:contain}
.partybar .pmini .ph{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.pslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 6px}
.ps{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;
  background:color-mix(in srgb,var(--el) 18%,var(--panel2));color:var(--tx);cursor:pointer}
.ps.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.ps img,.ps .ph{width:64px;height:64px;object-fit:contain}
.ps .ph,.pc .ph{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.ps .n,.pc .n{position:absolute;top:3px;left:5px;font-weight:800;font-size:13px;color:var(--acc)}
.ps .nm,.pc .nm{font-size:11.5px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pgroup h4{margin:12px 0 6px;font-size:12.5px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 3px;border:1px solid var(--line);border-radius:10px;
  background:color-mix(in srgb,var(--el) 12%,var(--panel2));color:var(--tx);cursor:pointer;min-width:0}
.pc:hover{border-color:var(--el)}
.pc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pc img,.pc .ph{width:52px;height:52px;object-fit:contain}
.pc .nm{font-size:10.5px}
.mc .top .dps{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mc .top .dps span{font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:5px}
.mc .top .slot{font-size:11.5px;color:var(--tx3);margin-left:auto;display:flex;align-items:center;gap:6px}
.mc .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px 10px}
.mc .f > label{display:block;font-size:11px;color:var(--tx3);margin-bottom:2px}
.mc .f .tri{display:flex;gap:4px}
.mc .stats{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px}
.mc .stats span b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.mc .stats span{color:var(--tx3)} .mc .stats span b{color:var(--tx)}
/* 휴대폰: 초상화를 카드 맨 위 띠로, 설정 칸은 두 줄씩 */
@media (max-width:639px){
  .card.mc{grid-template-columns:minmax(0,1fr)}
  .mc .art{justify-content:flex-start;align-items:flex-end;height:84px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--el) 45%,var(--panel)),color-mix(in srgb,var(--el) 8%,var(--panel)))}
  .mc .art img{width:84px;height:84px;margin:0 0 0 8px}
  .mc .art .ph{font-size:32px;margin:auto 0 auto 24px}
  .mc .art .share{left:auto;right:8px}
  .mc .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ps img,.ps .ph{width:48px;height:48px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
  .pc img,.pc .ph{width:44px;height:44px}
}
/* 화면 전환 단추 (파티 / 로테이션 / 설명) */
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.nav a{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--tx2);
  text-decoration:none;font-size:13px}
.nav a:hover{border-color:var(--acc);color:var(--acc)}
.nav a.on{border-color:var(--acc);color:var(--acc);background:var(--panel2);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.card h3{margin:0 0 2px;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.el{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.pct{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:400;font-variant-numeric:tabular-nums}
.dpsline{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin:3px 0 9px}
.dpsline span{font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:5px;letter-spacing:0}

.row{display:flex;gap:6px;align-items:center;margin:5px 0}
.row > label{flex:none;width:70px;font-size:11.5px;color:var(--tx2)}
.card .row > label{width:72px}
.tri select{min-width:0;flex:1;padding-left:5px;padding-right:2px;font-size:12px}
select,input[type=number]{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:7px;padding:5px 7px;font-size:12.5px;font-family:inherit;width:100%;min-width:0}
select:focus,input:focus{outline:1px solid var(--acc);outline-offset:-1px}
.mini{width:62px;flex:none}
.tri{display:flex;gap:5px;flex:1;min-width:0}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:9px 0 0;
  font-size:11.5px;border-top:1px solid var(--line);padding-top:8px}
.statgrid div{display:flex;justify-content:space-between;gap:6px}
.statgrid span:first-child{color:var(--tx3)}
.statgrid span:last-child{font-variant-numeric:tabular-nums}

.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--priBg);border-color:var(--priLine);color:var(--priTx)}
button:disabled{opacity:.4;cursor:default}

.note{font-size:11.5px;color:var(--tx3);margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.warnbox{background:var(--warnBg);border:1px solid var(--warnLine);color:var(--warnTx);border-radius:7px;
  padding:5px 8px;font-size:11.5px;margin-top:7px}

section{margin-top:18px}
section > h2{font-size:14px;font-weight:650;margin:0 0 8px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
th{color:var(--tx2);font-weight:500;font-size:11.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
.up{color:var(--good)}.down{color:var(--bad)}.zero{color:var(--tx3)}
.tag{display:inline-block;font-size:10.5px;padding:1px 5px;border-radius:4px;
  background:var(--panel2);color:var(--tx3);border:1px solid var(--line);margin-left:5px}
.tag.r5{color:var(--r5);border-color:var(--r5Line)}
.tag.r4{color:var(--r4);border-color:var(--r4Line)}
.tag.cur{color:var(--priTx);border-color:var(--priLine)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;overflow-x:auto;min-width:0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.cfg .row > label{width:98px}
.buffs{font-size:12px;color:var(--tx2);line-height:1.7}
.buffs b{color:var(--tx);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;
  align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.modal.on{display:flex}
.modal .inner{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  max-width:720px;width:100%;padding:16px 18px}
.modal h2{margin:0 0 3px;font-size:15px}
.modal .close{position:sticky;top:0;float:right}
.scroll{max-height:62vh;overflow:auto;margin-top:10px}
.foot{margin-top:26px;font-size:11.5px;color:var(--tx3);line-height:1.8;
  border-top:1px solid var(--line);padding-top:12px}
@media(max-width:560px){
  .hero .big{font-size:32px}
  .row > label{width:58px}
  .statgrid{grid-template-columns:1fr}
}

.tlrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px}
.tlrow > label{width:180px;flex:none;color:var(--dim);text-align:right}
.tlbar{position:relative;flex:1;height:16px;background:var(--tl);border-radius:3px;overflow:hidden}
.tlseg{position:absolute;top:0;height:16px;font-size:10px;line-height:16px;text-align:center;color:#06080c;font-weight:650;overflow:hidden;white-space:nowrap;border-right:1px solid #06080c}
.tlwin{position:absolute;top:0;height:16px;background:linear-gradient(90deg,#3c7bd6,#5aa0f0);opacity:.75}
.tltxt{position:absolute;right:5px;top:0;line-height:16px;font-size:10px;color:var(--tlTx)}
.tlnote{margin-top:8px;font-size:11px;color:var(--dim);line-height:1.6}
@media(max-width:720px){.tlrow>label{width:110px;font-size:10px}}
.mini-btn{font:inherit;font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--miniLine);background:var(--miniBg);color:var(--tx);cursor:pointer;white-space:nowrap}
.mini-btn:hover{background:var(--miniHover)}
.cfg{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))!important}
.cfg .row span{white-space:nowrap}
.h2s{font-size:12px;color:var(--tx3);font-weight:400;margin-left:4px}
.card h3 select{flex:1;background:var(--panel2);border-color:var(--line);padding-left:6px;color:var(--tx)}
.card h3 select:hover{border-color:var(--acc)}
select option,select optgroup{background:var(--panel2);color:var(--tx)}
select optgroup{color:var(--acc);font-weight:700}
select option:disabled{color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
<h1>원신 파티 DPS 분석</h1>
<div class="sub">아무 캐릭터 4명이나 골라 <b>gcsim</b>으로 파티 DPS를 계산합니다. 무기·성유물·운명의 자리 효과와 원소 에너지, 버프 지속시간을 프레임 단위로 계산합니다.</div>
<div id="app"></div>
</div>
<div class="modal" id="modal"><div class="inner">
  <button class="close" onclick="closeModal()">닫기</button>
  <div id="modalBody"></div>

  const SUB_KEYS = ['hp', 'atk', 'def', 'hp%', 'atk%', 'def%', 'er', 'em', 'cr', 'cd'];
  const FIXED = 2, LIQUID = 20, CAP = 10;
  const mainVal = k => /%$/.test(k) && !MAIN5[k] ? 0.466 : MAIN5[k];
  const num = v => (Math.round(v * 1e5) / 1e5).toString();

  // 유동 굴림 상한: 10 - 2 × (같은 주옵션 부위 수)   (gcsim 최적화기와 같은 규칙)
  function liquidCaps(m) {
    const caps = {};
    for (const k of SUB_KEYS) caps[k] = CAP;
    for (const k of [m.mains.sands, m.mains.goblet, m.mains.circlet]) if (caps[k] != null) caps[k] = Math.max(0, caps[k] - 2);
    return caps;
  }
  /* 최적화 전 기본 부옵션: 원충 4 → 치확·치피 → 주 스탯%  (gcsim 최적화기를 돌리면 대체됨) */
  function defaultSubs(m, scale, weights) {
    const caps = liquidCaps(m), s = {};
    // 캐릭터별 평균 분포(KQM DB 설정 기준)가 있으면 그 비율대로 20굴림을 나눈다 (상한 지키며 남는 굴림은 비율 큰 순으로)
    if (weights && Object.keys(weights).length) {
      const ks = Object.keys(weights).filter(k => caps[k] != null).sort((a, b) => weights[b] - weights[a]);
      const tw = ks.reduce((a, k) => a + weights[k], 0);
      let left = LIQUID;
      for (const k of ks) { const n = Math.min(caps[k], Math.floor(LIQUID * weights[k] / tw)); if (n > 0) { s[k] = n; left -= n; } }
      for (let guard = 0; left > 0 && guard < 100; guard++) {
        const k = ks.find(k => (s[k] || 0) < caps[k]) || ['cr', 'cd', 'er', 'atk%', 'hp%', 'em'].find(k => (s[k] || 0) < caps[k]);
        if (!k) break;
        // 비율 대비 가장 덜 받은 것부터
        const pick = ks.filter(k => (s[k] || 0) < caps[k]).sort((a, b) => ((s[a] || 0) / weights[a]) - ((s[b] || 0) / weights[b]))[0] || k;
        s[pick] = (s[pick] || 0) + 1; left--;
      }
      return s;
    }
    let left = LIQUID;
    const give = (k, n) => { const g = Math.min(n, caps[k] - (s[k] || 0), left); if (g > 0) { s[k] = (s[k] || 0) + g; left -= g; } };
    give('er', 4);
    give('cr', 6); give('cd', 6);
    give(scale === 'hp' ? 'hp%' : scale === 'def' ? 'def%' : scale === 'em' ? 'em' : 'atk%', 4);
    give('cd', 10); give('cr', 10); give('er', 10);
    return s;
  }

  function memberLines(m) {
    const k = m.gc, t = m.talents, L = [];
    L.push(`${k} char lvl=90/90 cons=${m.cons} talent=${t.na},${t.skill},${t.burst};`);
    L.push(`${k} add weapon="${m.weapon}" refine=${m.refine} lvl=90/90;`);
    if (m.sets.length === 1 || m.sets[0] === m.sets[1]) L.push(`${k} add set="${m.sets[0]}" count=4;`);
    else for (const s of m.sets) L.push(`${k} add set="${s}" count=2;`);
    const main = { hp: 4780, atk: 311 };
    for (const s of [m.mains.sands, m.mains.goblet, m.mains.circlet]) if (mainVal(s)) main[s] = (main[s] || 0) + mainVal(s);
    L.push(`${k} add stats ` + Object.entries(main).map(([s, v]) => `${s}=${num(v)}`).join(' ') + ';');
    const subs = m.subs || {};
    L.push(`${k} add stats ` + SUB_KEYS.map(s => `${s}=${SUB5[s]}*${FIXED + (subs[s] || 0)}`).join(' ') + ';');
    return L;
  }

  /* party: {members[4], rotation(text), duration, iterations, enemyLv, res, particles, swapDelay} */
  function toGcsl(p) {
    const L = [];
    p.members.forEach(m => { L.push(...memberLines(m)); L.push(''); });
    // hpMode: 끝이 있는 로테이션(KQM DB 방식) — 시간 제한 없이 로테이션이 끝날 때까지 돌리고 그 시간으로 DPS를 낸다
    // hpMode에서도 duration을 상한(300초)으로 둔다: 로테이션이 끝나면 그때 멈추고, 끝나지 않는 스크립트는 300초에서 끊긴다
    L.push(`options iteration=${p.iterations} duration=${p.hpMode ? 300 : p.duration} swap_delay=${p.swapDelay || 12};`);
    L.push(`target lvl=${p.enemyLv} resist=${p.res} radius=2 pos=0,2.4${p.hpMode ? ' hp=999999999' : ''};`);
    if (p.particles) L.push('energy every interval=480,720 amount=1;');
    L.push(adaptRotation(p.rotation, p.members, { alias: p.alias || root.GC_ALIAS, hpMode: p.hpMode, kqmCons: p.kqmCons, softBurst: p.softBurst, burstWait: p.burstWait, burstRetry: p.burstRetry, kqBuildCons: p.kqBuildCons }));
    return L.join('\n');
  }

  /* 끝이 있는 로테이션(hpMode)용 안전장치 + KQM 설정 맞춤
     · gcsim은 hp 모드에서 시간 제한(duration)을 보지 않아, 이 장비로는 끝나지 않는 반복문이 있으면 영원히 돈다.
       while 조건마다 "300초 전까지"를 붙여 그런 경우에도 끝나게 한다.
     · KQM 설정은 제출자의 무기를 전제로 한 조건이 있다 (예: 페보니우스가 터질 때까지 일반 공격).
       그 무기를 들고 있지 않으면 조건을 "이미 충족"으로 바꾼다.  alias: 별칭 → gcsim 이름 */
  // 끝없이 도는 로테이션(while 1 / for { })인지 — 아니면 끝까지 한 번 돌리는 hp 모드
  const stripComments = t => t.replace(/(\/\/|#).*$/gm, '');
  const isLooping = t => /\bwhile\s+(1|true)\s*\{|\bfor\s*\{/.test(stripComments(t));
  const WEAPON_MODS = { 'favonius-cd': 'favonius', 'sacrificial-cd': 'sacrificial' };
  function adaptRotation(text, members, opt) {
    opt = opt || {};
    const alias = opt.alias || {};
    let t = text.replace(/\.([a-z0-9_]+)\.(mods|status)\.(favonius-cd|sacrificial-cd)\b/g, (all, who, _, mod) => {
      const gc = alias[who] || who;
      const m = members.find(x => x.gc === gc);
      return m && !String(m.weapon).startsWith(WEAPON_MODS[mod]) ? '1' : all;
    });
    // 제출자보다 운명의 자리가 낮은 캐릭터: 원소전투 스킬을 "쿨타임이면 기다림" 대신 "준비됐을 때만" 쓰게 바꾼다
    // (예: 슈브르즈 4돌은 원소폭발 뒤 스킬 쿨타임이 없어 연달아 쓰는데, 낮은 돌파에서 그대로 두면 쿨타임 내내 멈춘다)
    if (opt.kqmCons) {
      const low = new Set(members.filter(m => opt.kqmCons[m.gc] != null && m.cons < opt.kqmCons[m.gc]).map(m => m.gc));
      let n = 0;
      if (low.size) t = t.replace(/(^|[;{}\n]\s*)([a-z0-9_]+)\s+((?:[a-z_]+(?:\[[^\]\n;]*\])?(?::\d+)?\s*,\s*)*[a-z_]+(?:\[[^\]\n;]*\])?(?::\d+)?)\s*;/g, (all, pre, who, acts) => {
        const gc = alias[who] || who;
        if (!low.has(gc)) return all;
        const list = acts.split(/\s*,\s*/);
        const k = list.findIndex(a => /^skill(\[[^\]]*\])?(?::\d+)?$/.test(a));
        if (k < 0) return all;
        // 쿨타임이 3초 안에 돌아오면 기다렸다 쓰고, 아니면 스킬부터 뒤는 건너뛴다
        const v = `__cw${++n}`;
        const before = list.slice(0, k).join(', ');
        return `${pre}let ${v} = f(); while !.${gc}.skill.ready && f() - ${v} < 180 { wait(6); } `
          + `if .${gc}.skill.ready { ${who} ${list.map((x, j) => j === k ? x.replace(/:\d+$/, '') : x).join(', ')}; }${before ? ` else { ${who} ${before}; }` : ''}`;
      });
    }
    // 호두 0돌: KQM 설정은 대부분 1돌(혈매향 중 강공격 스태미나 없음) 기준으로 "강공격 → 대시"를 반복해 0돌은 스태미나가 바닥나
    // 끝없이 기다린다 (예: 피슬·호두·수크로스·행추 292초 → 210초). 0돌 표준인 점프 캔슬로 바꾼다
    { const ht = members.find(m => m.gc === 'hutao'), kc = opt.kqBuildCons || {};
      if (ht && ht.cons < 1 && (kc.hutao || 0) >= 1)
        t = t.replace(/(^|[;{}\n]\s*)([a-z0-9_]+)(\s+[^;{}]*);/g, (all, pre, who, acts) =>
          (alias[who] || who) === 'hutao' ? pre + who + acts.replace(/\bdash\b/g, 'jump') + ';' : all); }
    // KQM 설정의 원소폭발은 제출자의 원충·장비를 전제로 "무조건 사용"이라, 에너지가 모자라면 gcsim은 찰 때까지 멈춘다
    // (예: 방랑자 파티에서 원소폭발이 매 사이클 돌아오지 않아 끝없이 기다림). 에너지가 거의 찼거나(15 이하 부족)
    // 쿨타임이 3초 안에 끝나면 최대 3초 기다렸다 쓰고, 그래도 안 되면 원소폭발만 건너뛰고 나머지 행동은 그대로 한다.
    if (opt.softBurst) {
      // "while !.x.burst.ready { 평타; }"처럼 원소폭발이 찰 때까지 채우는 반복문도 같은 이유로 끝없이 돈다
      // (예: 아쿠아 사이머라큘라 야란의 호두 파티 92초 → 306초). 3초는 그대로 채우고, 에너지가 15 이하로 모자라면 10초까지,
      // 에너지가 다 찼고 쿨타임이 5초 안이면 끝까지 기다린다. 그 밖에는 반복문을 끝내고 뒤의 원소폭발은 아래 규칙으로 건너뛴다.
      let h = 0;
      if (!opt.burstWait) t = t.replace(/(^|[;{}\n]\s*)while\s+([^{}\n]+?)\s*\{/g, (all, pre, cond) => {
        const gcs = [...new Set([...cond.matchAll(/!\s*\.([a-z0-9_]+)\.burst\.ready\b/g)].map(m => alias[m[1]] || m[1]))];
        if (!gcs.length) return all;
        const v = `__hw${++h}`;
        const bound = gcs.map(gc => `(f() - ${v} < 180 || (.${gc}.energy >= .${gc}.energymax - 15 && f() - ${v} < 600) || `
          + `(.${gc}.energy >= .${gc}.energymax && .${gc}.burst.cd <= 300))`).join(' && ');
        return `${pre}let ${v} = f(); while (${cond}) && ${bound} {`;
      });
      let n = 0;
      const ACT = /(^|[;{}\n]\s*)([a-z0-9_]+)\s+((?:[a-z_]+(?:\[[^\]\n;]*\])?(?::\d+)?\s*,\s*)*[a-z_]+(?:\[[^\]\n;]*\])?(?::\d+)?)\s*;/g;
      const KW = /^(let|if|while|for|wait|return|options|target|energy|active)$/;
      const isBurst = a => /^burst(\[[^\]]*\])?$/.test(a);
      // 다시 시도 모드(opt.burstRetry): 건너뛴 원소폭발을 기억해 두고, 뒤의 행동 줄마다 그 원소폭발이 준비됐으면 먼저 쓴다
      // (예: 시노·나히다·야란·종려 — 야란 원소폭발을 시도하는 순간 에너지가 조금 모자라 건너뛰면 사이클이 끝날 때까지
      //  다시 안 써서 에너지가 가득 찬 채로 끝난다). 끼어드는 교체·원소폭발이 버프 순서를 흐트러뜨릴 수 있어 DPS 비교로만 고른다.
      const retryGcs = opt.burstRetry && !opt.burstWait ? [...new Set([...t.matchAll(ACT)]
        .filter(m => !KW.test(m[2]) && m[3].split(/\s*,\s*/).some(isBurst)).map(m => alias[m[2]] || m[2]))] : [];
      // 앞 동작에 이어지는 줄(강공격·낙하공격 — 리오센슬리 "평타 바로 뒤 강공격", 한운 공중 낙하) 앞에는 끼우지 않는다
      const chained = list => /^(charge|aim|low_plunge|high_plunge)(?![a-z_])/.test(list[0]);
      const retry = except => retryGcs.filter(g => g !== except)
        .map(g => `if __rp_${g} == 1 && .${g}.burst.ready { ${g} burst; __rp_${g} = 0; } `).join('');
      // 캐릭터가 바뀌는 줄에만 끼운다: 한 캐릭터가 이어서 하는 동작(방랑자 비행 중 평타·대시, 라우마 이슬 소모 등) 사이에
      // 교체가 끼면 상태가 깨져 오류가 난다
      let prevWho = null;
      const atSwap = gc => { const s = prevWho !== gc || opt.burstRetry === 'all'; prevWho = gc; return s; };
      t = t.replace(ACT, (all, pre, who, acts) => {
        const list = acts.split(/\s*,\s*/);
        const k = list.findIndex(isBurst);
        if (KW.test(who)) return all;
        const swapHere = atSwap(alias[who] || who);
        if (k < 0) return retryGcs.length && swapHere && !chained(list) ? pre + retry(null) + all.slice(pre.length) : all;
        const gc = alias[who] || who;
        const v = `__bw${++n}`;
        // 원소폭발을 건너뛸 때 그 뒤의 원소전투 스킬은 원소폭발 상태 전용 동작인 경우가 많다
        // (예: 데히야 "burst, skill:10"은 원소폭발 중 발차기 — 그대로 두면 일반 스킬 10번을 쿨타임마다 기다려 80초 → 242초).
        // 원소폭발 앞의 동작은 그대로, 뒤의 스킬은 쿨타임이 3초 안에 끝나면 기다렸다가 한 번만 쓴다
        // (행추 "burst, attack, skill"처럼 곧 돌아오는 스킬은 그대로 쓰게). 스킬을 못 쓰면 그 뒤 동작도 뺀다
        // (타르탈리아처럼 스킬이 자세를 바꾸는 경우 뒤의 강공격이 오류가 난다).
        // 한 줄에 원소폭발이 여럿이면(플린스 월광 형태 원소폭발 등) 첫 원소폭발만 뺀다.
        let rest;
        // 기다림 모드(opt.burstWait): 원소폭발만 빼고 나머지는 그대로 (KQM 원래 순서에 가장 가깝다)
        if (opt.burstWait || list.filter(a => /^burst(\[[^\]]*\])?$/.test(a)).length > 1) rest = list.length > 1 ? `${who} ${list.filter((_, j) => j !== k).join(', ')};` : '';
        else {
          let s = 0;
          const build = (acts) => {
            const out = [];
            let cur = [];
            for (let j = 0; j < acts.length; j++) {
              const sk = acts[j].match(/^(skill(?:\[[^\]]*\])?)(?::\d+)?$/);
              if (!sk) { cur.push(acts[j]); continue; }
              if (cur.length) out.push(`${who} ${cur.join(', ')};`);
              const w = `${v}s${++s}`;
              const tail = build(acts.slice(j + 1));
              out.push(`let ${w} = f(); while !.${gc}.skill.ready && f() - ${w} < 180 { wait(6); } if .${gc}.skill.ready { ${who} ${sk[1]}; ${tail}}`);
              return out.join(' ');
            }
            if (cur.length) out.push(`${who} ${cur.join(', ')};`);
            return out.join(' ');
          };
          const before = list.slice(0, k);
          rest = (before.length ? `${who} ${before.join(', ')}; ` : '') + build(list.slice(k + 1));
        }
        rest = rest.trim();
        const rp = retryGcs.includes(gc);
        if (rp) rest = `__rp_${gc} = 1; ${rest}`.trim();
        return `${pre}${chained(list) || !swapHere ? '' : retry(gc)}let ${v} = f(); while !.${gc}.burst.ready && f() - ${v} < 180 && `
          + `((.${gc}.energy >= .${gc}.energymax - 15 && .${gc}.energy < .${gc}.energymax) || (.${gc}.energy >= .${gc}.energymax && .${gc}.burst.cd <= 180)) { wait(6); } `
          + `if .${gc}.burst.ready { ${who} ${acts};${rp ? ` __rp_${gc} = 0;` : ''} }${rest ? ` else { ${rest} }` : ''}`;
      });
      if (retryGcs.length) {
        // 기억용 변수는 맨 앞(첫 active 줄 뒤)에 만든다
        const decl = retryGcs.map(g => `let __rp_${g} = 0;`).join(' ') + '\n';
        const m = t.match(/(^|\n)[ \t]*active\s+[a-z0-9_]+\s*;[^\n]*\n/);
        t = m ? t.slice(0, m.index + m[0].length) + decl + t.slice(m.index + m[0].length) : decl + t;
      }
    }
    if (opt.hpMode) t = t.replace(/\bwhile\s+(?!(?:1|true)\s*\{)([^{}\n]+?)\s*\{/g, (all, cond) => `while (${cond}) && f() < ${Math.round((opt.cap || 300) * 60)} {`);
    return t;
  }

  /* gcsim 결과 요약 */
  const STAT_IDX = { 'def%': 1, def: 2, hp: 3, 'hp%': 4, atk: 5, 'atk%': 6, er: 7, em: 8, cr: 9, cd: 10, heal: 11,
    'pyro%': 12, 'hydro%': 13, 'cryo%': 14, 'electro%': 15, 'anemo%': 16, 'geo%': 17, 'dendro%': 18, 'phys%': 19 };
  function summarize(stat, details) {
    const n = stat.iterations || 1;
    const per = stat.character_dps.map(c => c.mean);
    const act = (i, k) => {
      const s = stat.character_actions && stat.character_actions[i] && stat.character_actions[i].sources;
      return s && s[k] ? s[k].mean : 0;
    };
    const rx = {};
    (stat.source_reactions || []).forEach(r => { if (r && r.sources) for (const k in r.sources) rx[k] = (rx[k] || 0) + r.sources[k].mean; });
    const failed = (stat.failed_actions || []).map(x => x ? { skill: x.skill_cd ? x.skill_cd.mean : 0, burst: x.burst_cd ? x.burst_cd.mean : 0,
      energy: x.insufficient_energy ? x.insufficient_energy.mean : 0, stamina: x.insufficient_stamina ? x.insufficient_stamina.mean : 0 } : null);
    return {
      duration: stat.duration ? stat.duration.mean : null,
      dps: stat.dps.mean, sd: stat.dps.sd || 0, se: (stat.dps.sd || 0) / Math.sqrt(n), iterations: n,
      per, bursts: per.map((_, i) => act(i, 'burst')), skills: per.map((_, i) => act(i, 'skill')),
      reactions: rx, failed,
      fieldTime: (stat.field_time || []).map(x => x.mean),
      energyEnd: (stat.end_stats || []).map(x => x && x.ending_energy ? x.ending_energy.mean : null),
      stats: (details || []).map(d => d && d.snapshot ? Object.fromEntries(Object.entries(STAT_IDX).map(([k, i]) => [k, d.snapshot[i] || 0])) : null),
      sources: (stat.source_dps || []).map((c, i) => {
        const cnt = (stat.source_damage_instances && stat.source_damage_instances[i] && stat.source_damage_instances[i].sources) || {};

  //      기본 블록과 대안(스킬 먼저 / 원소폭발 먼저 / 강공격 / 조준 사격)을 같은 시드로 돌려 보고 기본보다 3% 이상 높은 것만 넣었다.
  //      나머지는 기본 블록이 가장 높거나 차이가 3% 미만이었다.
  {
    const SKILL_FIRST = ['if .$.skill.ready { $ skill; }', 'if .$.burst.ready { $ burst; }', '$ attack;'];
    const CHARGE_STEP = ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill; }', '$ attack:2, charge;'];
    const BURST_FIRST = [Q, 'if .$.skill.ready { $ skill; }'];
    const set = (keys, prop, val) => keys.forEach(k => { B[k] = Object.assign({}, B[k] || {}, { [prop]: val }); });
    // 메인 딜러로 쓸 때 스킬 먼저가 3~13% 높았던 캐릭터
    set(['lisa', 'beidou', 'prune', 'yunjin', 'dori', 'jean', 'kirara', 'collei', 'travelergeo', 'dehya', 'kukishinobu',
      'kaeya', 'sigewinne', 'barbara', 'lauma', 'travelerhydro', 'travelerelectro', 'nilou'], 'step', SKILL_FIRST);
    // 메인 딜러로 쓸 때 강공격을 섞는 쪽이 6~10% 높았던 캐릭터
    set(['iansan', 'xianyun', 'emilie'], 'step', CHARGE_STEP);
    // 서포터로 쓸 때 원소폭발 먼저가 3~13% 높았던 캐릭터
    set(['skirk', 'klee', 'razor', 'kamisatoayaka', 'hutao', 'tighnari', 'aloy', 'freminet', 'wriothesley'], 'support', BURST_FIRST);
    // 새로 추가한 캐릭터 (gcsim 원본 미병합 PR)
    Object.assign(B, {
      // 네페르: 원소전투 스킬로 환영 충전 3회 → 이슬이 있으면 강공격(환영), 없으면 일반 공격. 달 개화 파티에서 일반 공격만 쓸 때보다 +76%
      nefer:      { step: ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill; }', 'if .dew > 0 && .$.status.nefer-shadow-dance > 0 { $ charge; } else { $ attack; }'], field: 8 },
      // 린네아: 원소폭발이 스킬 강화 상태를 갱신하므로 원소폭발 → 스킬 (달 결정 파티에서 +10%, 일반 파티에서는 차이 없음.
      //         원소폭발 버그 수정 전에는 +32%였는데, 대부분 루미 공격이 멈추던 버그 때문이었음)
      linnea:     { support: BURST_FIRST, order: 2, note: '원소폭발 → 원소전투 스킬' },
      vodyanitsa: { support: ['if .$.skill.ready { $ skill; }', Q], order: 2, step: SKILL_FIRST, field: 10 },
      kachina:    { support: ['if .$.skill.ready { $ skill; }', Q], order: 3 },
      // 로엔·베스나 (2026-11-22, 프레임은 유튜브 영상 기반 추정): 기책 상태에서 원소폭발 → 특수 스킬(희열 100) → 일반 1타+강공격 반복.
      //   원소폭발을 특수 스킬 3회 뒤로 미루면 -1.4%, 기책 밖에서 강공격만 쓰면 -0.8%
      lohen:      { step: ['if .$.burst.ready && .$.masterstroke { $ burst; }', 'if .$.skill.ready { $ skill; }',
                           'if .$.masterstroke { $ attack, charge; } else { $ attack; }'], field: 13 },
      //   베스나: 원소폭발(검기 30) → 스킬(검기 60) → 바람검, 바람 무장 중 일반 공격으로 바람깃 검기를 모은다. 강공격만 쓰면 -10%
      vesna:      { step: ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill; }', '$ attack;'], field: 12 },
      // 미탸·발레리 (2026-11-22, 프레임은 직접 녹화 영상에서 측정, 일부 추정):
      //   미탸 메인: 원소폭발(비콘 3) → 홀드 E(과열 융합로) → 비콘이 있으면 융합 폭발(특수 강공격), 없으면 일반 공격. 서브: 짧은 E(안정 융합로)
      //   발레리: 스킬(대포 에너지 40) → 바로 강공격(박격포, 공격 지령 15스택) → 원소폭발. 박격포를 빼면 -6%
      mitya:      { support: ['if .$.skill.ready { $ skill; }', Q], order: 3,
                    step: ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill[hold=1]; }',
                           'if .$.overload && .$.beacons > 0 { $ charge; } else { $ attack; }'], field: 12 },
      valeriy:    { support: ['if .$.skill.ready { $ skill, charge; }', Q], order: 1,
                    step: ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill; }',
                           'if .$.mortar_ready { $ charge; } else { $ attack; }'], field: 10 },
    });
    // 원소폭발을 잘 안 쓰는 캐릭터: KQM DB 로테이션에서 원소폭발을 쓰는 비율이 낮고(바바라 13%, 호두 30%, 알베도 32%, 닐루 46%, 실로닌 49%),
    // 그 캐릭터가 가장 많이 쓰인 KQM 파티로 돌려 봐도 원소폭발을 빼는 쪽이 같거나 높았던 역할에서만 뺀다.
    // (종려는 원래 홀드 E만 씀. 아를레키노·시그윈·데히야·플린스는 사용 비율은 낮아도 빼면 3~34% 떨어져서 그대로 둠)
    const noBurst = (k, role) => { const b = B[k]; if (!b || !b[role]) return;
      b[role] = b[role].filter(l => !l.startsWith(Q) && !/\bburst\b/.test(l)); b.noBurst = true; };
    noBurst('barbara', 'support'); noBurst('barbara', 'step');   // +0.4% / +1.3%
    noBurst('albedo', 'support');                                 // -0.2% (오차 범위)
    noBurst('hutao', 'step');                                     // +4.1%
    noBurst('xilonen', 'support');                                // +5.2%
    noBurst('nilou', 'support');                                  // +4.0% (메인 딜러일 때는 -2.9%라 유지)
  }

  const DEF_SUPPORT = ['if .$.skill.ready { $ skill; }', Q];
  const DEF_STEP = ['if .$.burst.ready { $ burst; }', 'if .$.skill.ready { $ skill; }', '$ attack;'];

  const block = k => B[k] || {};
  const sub = (lines, k) => lines.map(l => l.split('$').join(k));

  /* 원소폭발: 준비됐으면 사용. 에너지가 6 이하로 모자라면 최대 2초(6프레임×20) 기다린다.
     쿨타임 때문에 못 쓰는 경우(에너지 가득)는 기다리지 않는다. */
  function burstLines(k, v, after) {
    return [
      `let w${v} = 0;`,
      `while .${k}.burst.ready == 0 && .${k}.energy >= .${k}.energymax - 6 && .${k}.energy < .${k}.energymax && w${v} < 20 { wait(6); w${v} = w${v} + 1; }`,
      `if .${k}.burst.ready { ${k} burst${after ? ', ' + after : ''}; }`,
    ];
  }
  function supportLines(k, v) {
    let lines = (block(k).support || DEF_SUPPORT).slice();
    const out = [];
    for (const l of lines) {
      if (l.startsWith(Q)) out.push(...burstLines(k, v, l.slice(Q.length)));
      else out.push(...sub([l], k));
    }
    return out;
  }
  function driverLines(k, fieldSec) {
    const step = sub(block(k).step || DEF_STEP, k);
    return [
      `let t = f();`,
      `while f() - t < ${Math.round(fieldSec * 60)} {`,
      ...step.map(l => '  ' + l),
      `}`,
    ];
  }

  /* team: [{gc, driver?}], opt: {driverIdx, field}
     순서: 파티 칸 순서대로 서포터 → 메인 딜러 */
  function assemble(team, opt) {
    const d = opt.driverIdx;
    const sup = team.map((m, i) => i).filter(i => i !== d);
    const first = team[sup.length ? sup[0] : d].gc;
    const L = [`active ${first};`, 'while 1 {'];
    sup.forEach((i, n) => {
      L.push(`  # ${team[i].ko || team[i].gc}`);
      supportLines(team[i].gc, n).forEach(l => L.push('  ' + l));
    });
    L.push(`  # ${team[d].ko || team[d].gc} (메인 딜러, ${opt.field}초)`);
    driverLines(team[d].gc, opt.field).forEach(l => L.push('  ' + l));
    L.push('}');
    return L.join('\n');
  }
  // 파티 칸의 추천 순서: 서포터는 order가 작은 순, 메인 딜러는 마지막
  function suggestOrder(gcs, driverIdx) {
    const idx = gcs.map((g, i) => i).filter(i => i !== driverIdx);
    idx.sort((a, b) => ((block(gcs[a]).order ?? 3) - (block(gcs[b]).order ?? 3)));
    return driverIdx == null ? idx : idx.concat([driverIdx]);
  }
  const defaultField = k => block(k).field || 12;
  const hasBlock = (k, role) => !!(role === 'driver' ? block(k).step : block(k).support);

  /* 다듬은 프리셋: 정확히 이 4명일 때 손으로 다듬은 순서를 쓴다 */
  const PRESETS = [
    { id: 'neuv-furina-kazuha-zhongli', members: ['neuvillette', 'furina', 'kaedeharakazuha', 'zhongli'],
      label: '느비예트·푸리나·카즈하·종려',
      text: opt => `active neuvillette;
neuvillette skill;
while 1 {
  let f0 = 0;
  while .furina.burst.ready == 0 && .furina.energy >= 54 && f0 < 30 { wait(6); f0 = f0 + 1; }
  if .furina.burst.ready { furina burst; }
  furina skill;
  kaedeharakazuha skill[hold=1], high_plunge;
  let i = 0;
  while .kaedeharakazuha.energy >= 40 && .kaedeharakazuha.burst.ready == 0 && i < 30 { wait(6); i = i + 1; }
  if .kaedeharakazuha.burst.ready { kaedeharakazuha burst; }
  zhongli skill[hold=1];
  if .neuvillette.skill.ready { neuvillette skill; }
  # 강공격 3회, 그 사이 원소폭발이 준비되는 대로 사용 (6돌도 같은 순서가 더 높게 나옴: 한 번 길게 쏘는 방식보다 약 +13%)
  let j = 0;
  while j < 3 {
    if .neuvillette.burst.ready { neuvillette burst; }
    neuvillette charge;
    let k = 0;
    while .neuvillette.burst.ready == 0 && k < 28 { wait(6); k = k + 1; }
    j = j + 1;
  }
  if .neuvillette.burst.ready { neuvillette burst; }
}` },
  ];
  function presetFor(gcs) {
    const s = gcs.slice().sort().join(',');
    return PRESETS.find(p => p.members.slice().sort().join(',') === s) || null;
  }

  const API = { assemble, suggestOrder, defaultField, hasBlock, presetFor, PRESETS, BLOCKS: B };
  if (typeof module !== 'undefined') module.exports = API;
  root.ROT = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>'use strict';
/* =====================================================================
   원충 자동 맞춤
   · 지금 로테이션에서 원소폭발을 기다리느라 멈추는 캐릭터(에너지 부족 대기)나
     에너지를 무시했을 때보다 원소폭발을 덜 쓰는 캐릭터가 있으면,
     그 캐릭터의 부옵션 중 가장 많은 굴림을 하나씩 원충으로 옮긴다.
   · 대기가 없어지거나 원충이 유동 상한에 닿을 때까지 반복한다 (KQM 방식: 사이클에 필요한 만큼만 원충).
   · sim(subsList) → gcsim 요약 {failed[i].energy(초), bursts[i]} 을 돌려주는 함수를 받는다.
   ===================================================================== */
(function (root) {
  const G = root.GC3 || (typeof require !== 'undefined' ? require('./gc3.js') : null);
  // 같은 굴림 수면 덜 중요한 것부터 뺀다
  const TAKE = ['atk', 'hp', 'def', 'def%', 'hp%', 'atk%', 'em', 'cd', 'cr'];
  const WAIT_SEC = 0.5, SHORT_Q = 0.3;

  // 캐릭터 i의 부옵션 n굴림을 원충으로 (가장 많은 것부터 뺌). 옮긴 수를 돌려준다
  function moveER(s, cap, n) {
    let k = 0;
    for (; k < n; k++) {
      if ((s.er || 0) >= cap) break;
      const total = Object.values(s).reduce((x, y) => x + y, 0);
      if (total >= G.LIQUID) {
        const t = Object.keys(s).filter(x => x !== 'er' && s[x] > 0).sort((a, b) => s[b] - s[a] || TAKE.indexOf(a) - TAKE.indexOf(b))[0];
        if (!t) break;
        if (--s[t] === 0) delete s[t];
      }
      s.er = (s.er || 0) + 1;
    }
    return k;
  }
  const copy = subs => subs.map(x => Object.assign({}, x));

  /* 대기(에너지 부족)가 있는 캐릭터의 원충을, 대기가 없어지거나 유동 상한에 닿을 때까지 늘린다 (팀 전체를 한꺼번에).
     끝난 뒤 팀 DPS가 처음보다 낮으면 (끝없이 도는 로테이션에서 "준비되면 쓰는" 원소폭발까지 쫓다가 치명타만 잃은 경우)
     캐릭터별로 그 캐릭터만 맞춘 것을 따로 재 보고, 오르는 것만 받아들인다. */
  async function fitER(members, idxs, sim, ign, opt) {
    opt = opt || {};
    const tol = opt.tol || 0.002;
    const base = members.map(m => Object.assign({}, m.subs || {}));
    const need = (r, i) => (r.failed && r.failed[i] ? r.failed[i].energy : 0) >= WAIT_SEC || (ign ? ign.bursts[i] - r.bursts[i] : 0) >= SHORT_Q;
    const amount = (r, i) => { const w = r.failed && r.failed[i] ? r.failed[i].energy : 0, sh = ign ? ign.bursts[i] - r.bursts[i] : 0;
      return w > 20 || sh > 2 ? 3 : w > 6 || sh > 1 ? 2 : 1; };
    const r0 = await sim(base);
    let subs = copy(base), res = r0, steps = 0;
    const moved = members.map(() => 0), capped = new Set();
    for (; steps < (opt.maxSteps || 12); steps++) {
      let changed = false;
      for (const i of idxs) {
        if (!need(res, i)) continue;
        const n = moveER(subs[i], G.liquidCaps(members[i]).er, amount(res, i));
        if (!n) { capped.add(i); continue; }
        moved[i] += n; changed = true;
      }
      if (!changed) break;
      if (opt.onStep) opt.onStep(steps + 1);
      res = await sim(subs);
    }
    if (res.dps < r0.dps * (1 - tol) && moved.some(n => n > 0)) {
      // 캐릭터별로 따로
      const keep = [];
      for (const i of idxs) {
        if (!moved[i]) continue;
        const one = copy(base); one[i] = subs[i];
        const r1 = await sim(one);
        if (r1.dps > r0.dps * (1 + tol)) keep.push({ i, r: r1 });
      }
      const fin = copy(base); keep.forEach(k => { fin[k.i] = subs[k.i]; });
      const finMoved = members.map((_, i) => keep.some(k => k.i === i) ? moved[i] : 0);
      let rf = keep.length === 0 ? r0 : keep.length === 1 ? keep[0].r : await sim(fin);
      if (keep.length > 1) { const bestOne = keep.reduce((a, b) => b.r.dps > a.r.dps ? b : a);
        if (bestOne.r.dps > rf.dps) { const o = copy(base); o[bestOne.i] = subs[bestOne.i];
          return { subs: o, moved: members.map((_, i) => i === bestOne.i ? moved[i] : 0), capped: [], res: bestOne.r, steps, partial: true }; } }
      return { subs: fin, moved: finMoved, capped: [], res: rf, steps, partial: true };
    }
    return { subs, capped: [...capped].filter(i => need(res, i)), moved, res, steps };
  }

  /* 부옵션 전체 최적화 (KQM 방식: 유동 20굴림, 주옵션과 같은 부옵션은 상한 -2)
     1) 원충: fitER로 원소폭발을 기다리지 않을 만큼만
     2) 나머지: 같은 시드로 "이 스탯 +1굴림"을 각각 재서, 가장 덜 오르는 스탯에서 가장 많이 오르는 스탯으로 한 굴림씩 옮긴다.
        옮긴 뒤 실제로 다시 재서 오르면 계속, 아니면 멈춘다.
     버프(무기·세트·운명의 자리·파티원)는 gcsim이 계산하므로, 버프로 이미 많이 얻은 스탯은 측정값이 작게 나와 자연스럽게 덜 받는다. */
  // 모든 스탯을 후보로 둔다: 피해 계수와 상관없이 버프에 쓰는 스탯(슈브르즈 HP, 운근 방어력, 카즈하 원마)이나
  // 피해로 바뀌는 원충(라이덴·모나)도 측정값이 크면 굴림을 받는다
  const DMG_KEYS = ['cr', 'cd', 'atk%', 'hp%', 'def%', 'em', 'er'];
  async function optimizeSubs(members, idxs, sim, ign, opt) {
    opt = opt || {};
    const tol = opt.tol || 0.001;
    const er = await fitER(members, idxs, sim, ign, opt);
    let subs = er.subs, base = er.res;
    // 원충 바닥: 원소폭발을 기다리지 않게 맞춘 양 아래로는 빼지 않는다
    const erFloor = subs.map(x => x.er || 0);
    if (!base) base = await sim(subs);
    let probes = 0;
    const deltas = {};
    for (const i of idxs) {
      const m = members[i], caps = G.liquidCaps(m);
      const cand = (opt.keys && opt.keys(m)) || DMG_KEYS;
      for (let it = 0; it < (opt.maxIter || 6); it++) {
        const s = subs[i];
        // 후보 밖 스탯(고정 수치 등)에 굴림이 있으면 먼저 그걸 뺀다
        const junk = Object.keys(s).filter(k => !cand.includes(k) && s[k] > 0 && (k !== 'er' || s.er > erFloor[i]));
        const addable = cand.filter(k => (s[k] || 0) < caps[k]);
        if (!addable.length) break;
        if (opt.onStep) opt.onStep(i, it);
        const gains = {};
        await Promise.all(cand.map(async k => {
          if ((s[k] || 0) >= caps[k] && !(s[k] > 0)) return;
          const t = subs.map(x => Object.assign({}, x)); t[i][k] = (t[i][k] || 0) + 1;
          gains[k] = (await sim(t)).dps; probes++;
        }));
        deltas[i] = Object.fromEntries(Object.entries(gains).map(([k, v]) => [k, v - base.dps]));
        const up = addable.filter(k => gains[k] != null).sort((a, b) => gains[b] - gains[a])[0];
        let down = junk[0];
        if (!down) down = cand.filter(k => s[k] > 0 && k !== up && gains[k] != null && (k !== 'er' || s.er > erFloor[i])).sort((a, b) => gains[a] - gains[b])[0];
        if (!up || !down) break;
        if (!junk.length && (gains[up] - gains[down]) / base.dps < tol) break;
        const step = !junk.length && (gains[up] - gains[down]) / base.dps > 0.02 && s[down] - (down === 'er' ? erFloor[i] : 0) >= 2 && (s[up] || 0) + 2 <= caps[up] ? 2 : 1;
        const t = subs.map(x => Object.assign({}, x));
        t[i][down] -= step; if (!t[i][down]) delete t[i][down];
        t[i][up] = (t[i][up] || 0) + step;
        const r = await sim(t); probes++;
        if (r.dps < base.dps * (1 - tol / 2)) break;
        subs = t; base = r;
      }
    }
    return { subs, res: base, moved: er.moved, capped: er.capped, probes, deltas };
  }

  /* 주옵션까지: 부옵션을 맞춘 뒤 잰 "스탯별 1굴림 가치"로 모래·성배·왕관마다 바꿀 만한 후보를 고르고
     (주옵션 하나 ≈ 같은 스탯 부옵션 9.4굴림), 후보로 바꿔 부옵션을 다시 맞춘 뒤 실제로 재서 오를 때만 바꾼다.
     캐릭터마다 따로(다른 캐릭터는 고정) 동시에 돌리고 마지막에 합쳐서 한 번 더 잰다. */
  const ROLLS_PER_MAIN = 9.4;
  function fixCaps(m, sub) {
    const caps = G.liquidCaps(m), s2 = Object.assign({}, sub);
    let spill = 0;
    for (const k of Object.keys(s2)) if (s2[k] > caps[k]) { spill += s2[k] - caps[k]; s2[k] = caps[k]; }
    for (const k of ['cr', 'cd', 'atk%', 'em', 'hp%', 'def%']) { while (spill > 0 && (s2[k] || 0) < caps[k]) { s2[k] = (s2[k] || 0) + 1; spill--; } }
    return s2;
  }
  async function optimizeMember(members, i, subsAll, sim, ign, opt) {
    // sim(부옵션 목록, 주옵션 목록) — 주옵션을 바꾼 후보는 그 주옵션으로 잰다
    const mk = ms => (sb, it) => optimizeSubs(ms.map((m, j) => Object.assign({}, m, { subs: sb[j] })), [i],
      t => sim(t, ms.map(x => x.mains)), ign, Object.assign({}, opt, { maxIter: it }));
    let ms = members.map((m, j) => Object.assign({}, m, { subs: subsAll[j] }));
    let best = await mk(ms)(subsAll, opt.maxIter || 8);
    const m = ms[i];
    if (!opt.mainsAuto || !opt.mainsAuto(m)) return { mains: m.mains, subs: best.subs[i], res: best.res, moved: best.moved[i], capped: best.capped.includes(i) };
    const allowed = opt.mainOptions(m);
    for (const slot of ['sands', 'goblet', 'circlet']) {
      const cur = ms[i].mains[slot], d = best.deltas[i] || {};
      const est = k => d[k] != null ? d[k] * ROLLS_PER_MAIN : null;
      const tries = [];
      const ranked = allowed[slot].filter(k => k !== cur && est(k) != null).sort((a, b) => est(b) - est(a));
      if (ranked[0] && (est(cur) == null || est(ranked[0]) > est(cur))) tries.push(ranked[0]);
      // 원충 모래: 부옵션으로 원충을 4굴림 넘게 채웠거나 상한이면 모래로 바꿔 보기
      // 원소폭발이 아직 빠지면 부옵션 원충이 적어도 바꿔 본다: 원충 부옵션 몇 굴림으로는 한 번도 더 못 쓰다가
      // 모래(약 9굴림)에서야 한 번 더 쓰는 계단 모양이라 1굴림 측정으로는 안 보인다 (예: 두린 파티 48.7k → 65.9k)
      const stillShort = ign && best.res && best.res.bursts && ign.bursts[i] - best.res.bursts[i] >= 1;
      if (slot === 'sands' && cur !== 'er' && allowed.sands.includes('er') && ((best.subs[i].er || 0) >= 4 || best.capped.includes(i) || stillShort)) tries.push('er');
      // 원소 피해 성배는 부옵션 측정값이 없으니, 다른 후보가 있으면 직접 비교
      for (const alt of [...new Set(tries)]) {
        const ms2 = ms.map((x, j) => j === i ? Object.assign({}, x, { mains: Object.assign({}, x.mains, { [slot]: alt }) }) : x);
        const sb = best.subs.map((x, j) => j === i ? fixCaps(ms2[i], x) : x);
        if (alt === 'er') { const e = sb[i]; const back = Math.min(e.er || 0, 8); e.er = (e.er || 0) - back; if (!e.er) delete e.er; e.cr = (e.cr || 0) + back; sb[i] = fixCaps(ms2[i], e); }
        const r = await mk(ms2)(sb, 4);
        if (r.res.dps > best.res.dps * 1.002) { ms = ms2; best = r; }
      }
    }
    return { mains: ms[i].mains, subs: best.subs[i], res: best.res, moved: best.moved[i], capped: best.capped.includes(i) };
  }
  async function optimizeAll(members, idxs, sim, ign, opt) {
    opt = opt || {};
    const subs0 = members.map(m => Object.assign({}, m.subs || {}));
    const per = await Promise.all(idxs.map(i => optimizeMember(members, i, subs0, sim, ign, opt)));
    const mains = members.map(m => m.mains), subs = subs0.slice();
    idxs.forEach((i, k) => { mains[i] = per[k].mains; subs[i] = per[k].subs; });
    const res = await sim(subs, mains);
    return { mains, subs, res, moved: members.map((_, j) => { const k = idxs.indexOf(j); return k >= 0 ? per[k].moved : 0; }),
      capped: idxs.filter((i, k) => per[k].capped) };
  }

  const API = { fitER, optimizeSubs, optimizeAll };
  if (typeof module !== 'undefined') module.exports = API;
  root.ERFIT = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>'use strict';
/* =====================================================================
   gcsim 워커 풀
   · main.wasm.gz를 한 번 받아 압축을 풀고 컴파일한 뒤, 워커 여러 개에 나눠 준다
   · run(gcsl, 반복 수): 반복을 워커 수만큼 나눠 돌리고 합친다 (메인 화면용)
   · runOne(gcsl, 반복 수): 워커 하나에서 돌린다 (순위표처럼 후보가 많을 때)
   · 같은 설정 문자열은 결과를 캐시한다 → 순위표 숫자와 적용 후 숫자가 같다
   ===================================================================== */
(function (root) {
  const WORKER_SRC = `
let ready = null;
self.onmessage = async (e) => {
  const d = e.data;
  try {
    if (d.type === 'init') {
      const go = new Go();
      const inst = d.module ? await WebAssembly.instantiate(d.module, go.importObject)
                            : (await WebAssembly.instantiate(d.bytes, go.importObject)).instance;
      go.run(inst).then(() => self.postMessage({ exited: true }));
      await new Promise(r => setTimeout(r, 30));
      self.postMessage({ id: d.id, ok: true });
      return;
    }
    if (d.type === 'run') {
      const init = self.initializeAggregator(d.cfg);
      if (typeof init === 'string' && init.startsWith('{"error')) throw new Error(JSON.parse(init).error);
      const err = self.initializeWorker(d.cfg);
      if (err) throw new Error(JSON.parse(err).error);
      const seeded = d.seeds && typeof self.simulateSeed === 'function';
      const n = seeded ? d.seeds.length : d.iters;
      for (let i = 0; i < n; i++) {
        const out = seeded ? self.simulateSeed(String(d.seeds[i])) : self.simulate();
        if (typeof out === 'string') throw new Error(JSON.parse(out).error);
        self.aggregate(out);
      }
      const f = self.flush();
      const res = JSON.parse(f.result);
      self.postMessage({ id: d.id, ok: true, stat: res.statistics, details: res.character_details, seeded });
    }
    if (d.type === 'caps') {
      self.postMessage({ id: d.id, ok: true, seed: typeof self.simulateSeed === 'function' });
    }
  } catch (err) { self.postMessage({ id: d.id, ok: false, error: String(err && err.message || err) }); }
};`;

  /* 이 브라우저에 계산 결과를 저장해 두는 곳 (IndexedDB). 같은 gcsim 설정을 다시 계산하면 저장된 결과를 쓴다
     (새로고침 뒤에도, 순위표·원충 맞춤의 짧은 계산까지). 키는 gcsim 버전 + 설정 전체의 해시라 엔진을 다시 빌드하면 자동으로 새로 계산한다.
     개인 브라우저 안에만 저장되고 다른 사람과 공유되지 않는다. 저장이 막힌 브라우저(사생활 보호 모드 등)에서는 그냥 계산한다 */
  const LOCALDB = (() => {
    let dbp = null, puts = 0;
    const MAX = { runs: 8000, ranks: 300 };
    const open = () => dbp || (dbp = new Promise(res => {
      try {
        const r = indexedDB.open('gdps-cache', 1);
        r.onupgradeneeded = () => { const d = r.result; ['runs', 'ranks'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    }));
    const tx = async (store, mode, fn) => {
      const d = await open(); if (!d) return null;
      return new Promise(res => {
        try { const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
          t.oncomplete = () => res(req ? req.result : null); t.onerror = t.onabort = () => res(null); } catch (e) { res(null); }
      });
    };
    // 오래된 것부터 지워 개수를 MAX의 80%로
    const prune = store => tx(store, 'readwrite', s => {
      const all = [];
      const c = s.openCursor();
      c.onsuccess = () => { const cur = c.result;
        if (cur) { all.push([cur.key, cur.value && cur.value.t || 0]); cur.continue(); return; }
        if (all.length > MAX[store]) all.sort((a, b) => a[1] - b[1]).slice(0, all.length - Math.floor(MAX[store] * 0.8)).forEach(([k]) => s.delete(k)); };
      return null;
    });
    const hash = async s => { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return null; } };
    return {
      async get(store, key) { const r = await tx(store, 'readonly', s => s.get(key)); return r && r.v != null ? r.v : null; },
      async put(store, key, v) { await tx(store, 'readwrite', s => s.put({ v, t: Date.now() }, key)); if (++puts % 200 === 0) prune(store); },
      hash,
    };
  })();
  root.LOCALDB = LOCALDB;

  const S = { status: 'idle', error: null, workers: [], idle: [], queue: [], seq: 0, wait: {}, cache: new Map(), listeners: [] };
  const notify = () => S.listeners.forEach(f => { try { f(S.status); } catch (e) {} });

  async function fetchWasm() {
    const tryGet = async (name) => { const r = await fetch(name); if (!r.ok) throw new Error(name + ' ' + r.status); return r; };
    const r = await tryGet('gcsim.wasm?v=' + (root.GCSIM_VERSION || '1'));
    let buf = new Uint8Array(await r.arrayBuffer());
    if (buf[0] === 0x1f && buf[1] === 0x8b) {   // gzip
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([buf]).stream().pipeThrough(ds);
      buf = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return buf;
  }

  function post(w, msg, transfer) {
    return new Promise((res, rej) => {
      const id = ++S.seq; S.wait[id] = { res, rej }; w.pid = id;
      w.postMessage(Object.assign({ id }, msg), transfer || []);
    });
  }

  /* 워커 하나 만들기 (컴파일된 모듈 재사용). 멈춘 워커를 갈아 끼울 때도 쓴다 */
  async function spawn() {
    const w = new Worker(S.url);
    w.onmessage = (e) => {
      if (e.data.exited) { w.dead = true; if (w.job) killJob(w, 'gcsim이 멈췄습니다'); return; }
      const p = S.wait[e.data.id]; if (!p) return; delete S.wait[e.data.id];
      e.data.ok ? p.res(e.data) : p.rej(new Error(e.data.error));
    };
    w.onerror = (e) => { S.error = e.message || '워커 오류'; };
    await post(w, { type: 'init', module: S.module });
    return w;
  }
  /* 시간 안에 끝나지 않은 작업: 워커를 버리고 새로 만든다 (wasm은 중간에 멈출 수 없으므로) */
  function killJob(w, why) {
    const job = w.job; w.job = null;
    clearTimeout(w.timer);
    if (w.pid) { delete S.wait[w.pid]; w.pid = 0; }
    try { w.terminate(); } catch (e) {}
    const i = S.workers.indexOf(w);
    if (job) job.rej(new Error(why));
    spawn().then(nw => { if (i >= 0) S.workers[i] = nw; else S.workers.push(nw); S.idle.push(nw); pump(); },
      e => { S.status = 'error'; S.error = 'gcsim 워커를 다시 만들지 못했습니다: ' + e.message; notify(); });
  }

  async function init() {
    if (S.status !== 'idle') return S.ready;
    S.status = 'loading'; notify();
    S.ready = (async () => {
      try {
        if (typeof Worker === 'undefined' || typeof WebAssembly === 'undefined') throw new Error('이 브라우저는 WebAssembly 워커를 지원하지 않습니다');
        const [bytes, exec] = await Promise.all([fetchWasm(), fetch('wasm_exec.js').then(r => { if (!r.ok) throw new Error('wasm_exec.js ' + r.status); return r.text(); })]);
        let module = null;
        try { module = await WebAssembly.compile(bytes); } catch (e) { throw new Error('WebAssembly 컴파일 실패: ' + e.message); }
        const url = URL.createObjectURL(new Blob([exec, '\n', WORKER_SRC], { type: 'text/javascript' }));
        S.url = url; S.module = module;
        const hc = (typeof navigator !== 'undefined' && navigator.hardwareConcurrency) || 4;
        // 워커 하나가 gcsim 전체를 메모리에 올리므로: 휴대폰은 2개, 메모리 8GB 이상 PC는 코어 수만큼(최대 8), 나머지는 4개
        const mobile = typeof navigator !== 'undefined' && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '');
        const mem = (typeof navigator !== 'undefined' && navigator.deviceMemory) || 4;
        const n = Math.max(1, Math.min(mobile ? 2 : mem >= 8 ? 8 : 4, hc - 1));
        S.size = n;
        const ws = await Promise.all(Array.from({ length: n }, () => spawn()));
        S.workers = ws; S.idle = ws.slice();
        S.caps = await post(ws[0], { type: 'caps' });
        S.status = 'ready'; notify(); pump();
      } catch (e) {
        S.status = 'error'; S.error = e.message; notify();
        S.queue.forEach(j => j.rej(e)); S.queue = [];
      }
    })();
    return S.ready;
  }

  function pump() {
    while (S.idle.length && S.queue.length) {
      const w = S.idle.shift(); const job = S.queue.shift();
      if (job.cancelled) { S.idle.push(w); continue; }
      // 반복 1회에 1.5초 + 8초를 넘기면 끝나지 않는 설정으로 보고 워커를 갈아 끼운다
      const n = job.seeds ? job.seeds.length : job.iters;
      w.job = job;
      w.timer = setTimeout(() => killJob(w, '시간 초과 — 로테이션이 끝나지 않습니다(조건이 이 장비에서 충족되지 않는 반복문일 수 있음)'), 8000 + 1500 * n);
      post(w, { type: 'run', cfg: job.cfg, iters: job.iters, seeds: job.seeds })
        .then(d => { if (w.job !== job) return; clearTimeout(w.timer); w.job = null; job.res(d); S.idle.push(w); pump(); },
              e => { if (w.job !== job) return; clearTimeout(w.timer); w.job = null; job.rej(e); S.idle.push(w); pump(); });
    }
  }
  function enqueue(cfg, iters, front, tag, seeds) {
    return new Promise((res, rej) => {
      if (S.status === 'error') return rej(new Error(S.error));
      const job = { cfg, iters, res, rej, tag, seeds };
      front ? S.queue.unshift(job) : S.queue.push(job);
      if (S.status === 'idle') init(); else if (S.status === 'ready') pump();
    });
  }

  const cacheKey = g => g.replace(/iteration=\d+/, '');
  S.pending = new Map();
  // 같은 설정이 이미 계산 중이면 그 결과를 같이 기다린다 (숫자가 하나로 정해지도록)
  function once(k, make) {
    if (S.cache.has(k)) return Promise.resolve(S.cache.get(k));
    if (S.pending.has(k)) return S.pending.get(k);
    // 이 브라우저에 저장된 결과가 있으면 그것을, 없으면 계산하고 저장
    const p = (async () => {
      const hk = await LOCALDB.hash((root.GCSIM_VERSION || '') + '|' + k);
      if (hk) { const hit = await LOCALDB.get('runs', hk); if (hit) return hit; }
      const r = await make();
      if (hk) LOCALDB.put('runs', hk, r);
      return r;
    })().then(r => { S.cache.set(k, r); S.pending.delete(k);
                                 if (S.cache.size > 4000) for (const old of S.cache.keys()) { S.cache.delete(old); if (S.cache.size <= 3000) break; }
                                 return r; },
                          e => { S.pending.delete(k); throw e; });
    S.pending.set(k, p);
    return p;
  }
  /* 메인 화면: 반복을 워커 수만큼 나눔.
     시드 지원 시 시드 1000..1000+n-1을 나눠 돌리므로, 같은 설정·같은 반복 수면 항상 같은 숫자가 나온다 */
  function run(gcsl, iters) { return once(cacheKey(gcsl), () => split(gcsl, iters, 'main')); }
  /* 워커 하나에서 시드 1000..1000+n-1로 돌린다 (모든 후보가 같은 난수로 비교되도록) */
  function seededOne(key, gcsl, iters, tag) {
    return once(key, async () => {
      const seeds = Array.from({ length: iters }, (_, i) => 1000 + i);
      const d = await enqueue(gcsl, iters, false, tag, seeds);
      const r = GC3.summarize(d.stat, d.details); r.seeded = d.seeded; return r;
    });
  }
  /* 원충 맞춤용 짧은 계산: 반복 수까지 키에 넣어 본 계산 캐시와 섞이지 않게 */
  const probe = (gcsl, iters, tag) => seededOne('probe:' + gcsl, gcsl, iters, tag || 'probe');
  function split(gcsl, iters, tag) {
    return (async () => {
      if (S.status === 'idle') init();
      await S.ready;
      if (S.status === 'error') throw new Error(S.error);
      const c = await caps();
      const n = Math.max(1, S.workers.length);
      const per = Math.ceil(iters / n);
      const jobs = Array.from({ length: n }, (_, j) => {
        const lo = j * per, hi = Math.min(iters, lo + per);
        if (hi <= lo) return null;
        const seeds = c.seed ? Array.from({ length: hi - lo }, (_, q) => 1000 + lo + q) : null;
        return enqueue(gcsl, hi - lo, true, tag, seeds);
      }).filter(Boolean);
      const parts = await Promise.all(jobs);
      const r = GC3.merge(parts.map(d => GC3.summarize(d.stat, d.details)));
      r.seeded = !!c.seed;
      return r;
    })();
  }
  /* 순위표: 후보 하나를 워커 하나에서. 시드 지원 시 모든 후보가 같은 시드 1..n을 쓴다 (같은 난수로 비교) */
  const runOne = (gcsl, iters, tag) => seededOne(cacheKey(gcsl), gcsl, iters, tag || 'rank');
  /* 순위표 1단계: 후보 하나를 워커 하나에서 짧게 (반복 수까지 키에 넣어 본 계산 캐시와 섞이지 않게) */
  const quick = (gcsl, iters, tag) => seededOne('quick' + iters + ':' + cacheKey(gcsl), gcsl, iters, tag || 'rank');
  async function caps() {
    if (S.status === 'idle') init();
    await S.ready;
    if (S.status === 'error') return { seed: false };
    return S.caps || { seed: false };
  }
  const cached = g => S.cache.get(cacheKey(g)) || null;
  const cancelQueued = (tag) => {
    const keep = [];
    S.queue.forEach(j => (!tag || j.tag === tag) ? j.rej(new Error('cancelled')) : keep.push(j));
    S.queue = keep;
  };

  root.GCPOOL = { init, run, probe, quick, runOne, caps, cached, cancelQueued, state: S, onStatus: f => S.listeners.push(f) };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

}

/* ---- KQM DB 프리셋 (db.kqm.gg에 공유된 gcsim 설정의 로테이션, 파티별 최신 1개) ---- */
let KQM = null, kqmState = 'idle';
async function loadKqm() {

function runPick(key, cmpAsm) {

  Promise.all([GCPOOL.quick(ga, 30, 'pick'), q(gcslOf(w)), gy !== ga ? q(gy) : null, gz !== gy && gz !== ga ? q(gz) : null,

/* 순위: 후보마다 한 칸만 바꾼 파티를 gcsim으로 돌린다. 부옵션은 지금 것 그대로(인게임에서 바꿔 끼우는 것과 같음).
   모든 후보가 같은 시드를 쓰고, 결과는 저장되므로 적용하면 표의 숫자가 그대로 나온다. */
const PATCH = [];
/* 후보가 많으면 2단계: 먼저 모든 후보를 짧게(20회, 같은 시드) 돌려 보고, 1등과 10% 이내이거나 상위 8개만 끝까지(설정 반복 수) 돌린다.
   짧게만 돈 후보는 "≈"로 표시한다 (어차피 한참 아래인 것들). */
const QUICK = 20;
/* 순위표 공유 저장소: 같은 설정(파티 전체 gcsim 설정 + 후보 목록 + gcsim·KQM 버전)으로 누가 이미 계산한 순위표는
   계산 없이 바로 보여 준다. 설정이나 버전이 하나라도 바뀌면 키가 달라져 새로 계산한다.
   저장된 값은 다른 방문자가 쓴 것이므로 숫자·스탯 이름만 검사해서 받는다. */
const RCACHE = (() => {
  const VER = 3;   // 2: 최종 후보는 파티원도 다시 맞춤 (팀 주옵션·부옵션 저장), 3: KQM 원소폭발 기다림/건너뜀 판단
  let dbp = null;
  // Claude 아티팩트에서는 공용 저장소(모두가 같이 씀), 그 밖(github.io 등)에서는 이 브라우저의 저장소
  const localDoc = p => ({ get: async () => { const v = await LOCALDB.get('ranks', p); return { exists: v != null, data: () => v }; },
    set: v => LOCALDB.put('ranks', p, v) });
  const db = () => dbp || (dbp = (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve(window.claude.use('db')).catch(() => null) : Promise.resolve({ doc: localDoc }));
  const timeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  const hex = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
  const num = x => typeof x === 'number' && isFinite(x);
  const STAT = /^[a-z%]{1,10}$/;
  const okStats = s => s && typeof s === 'object' && !Array.isArray(s)
    && Object.entries(s).every(([k, v]) => STAT.test(k) && Number.isInteger(v) && v >= 0 && v <= 40);
  const okMains = s => s && typeof s === 'object' && ['sands', 'goblet', 'circlet'].every(k => STAT.test(String(s[k])));
  const pick = (x, i) => x && num(x.dps) ? { dps: x.dps, se: num(x.se) ? x.se : 0, f: (x.failed && x.failed[i]) || null } : null;
  const unpick = (x, i) => {
    if (!x || !num(x.dps)) return null;
    const f = x.f && typeof x.f === 'object' ? { skill: +x.f.skill || 0, stamina: +x.f.stamina || 0, burst: +x.f.burst || 0 } : null;
    return { dps: x.dps, se: num(x.se) ? x.se : 0, failed: f ? { [i]: f } : null };
  };
  return {
    key: (kind, i, base, refit, rows) => hex(JSON.stringify([VER, window.GCSIM_VERSION, window.KQM_VERSION, SEEDED,
      kind, i, refit, base, rows.map(r => JSON.stringify(r.patch))])),
    async get(k) {
      try {
        const d = await timeout(db(), 4000); if (!d) return null;
        const s = await timeout(d.doc('ranks/' + k).get(), 5000);
        return s && s.exists ? s.data() : null;
      } catch (e) { return null; }
    },
    // 저장된 순위표를 rows에 채운다. 모양이 하나라도 이상하면 쓰지 않고 새로 계산한다
    restore(hit, rows, i) {
      const R = hit && Array.isArray(hit.rows) ? hit.rows : null;
      if (!R || R.length !== rows.length || !num(hit.at)) return false;
      const out = [];
      for (let j = 0; j < rows.length; j++) {
        const x = R[j] || {};
        const res = unpick(x.res, i), q = unpick(x.q, i);
        if (!res && !q) return false;
        if (x.mains != null && !okMains(x.mains)) return false;
        if (x.subs != null && !okStats(x.subs)) return false;
        if (x.team != null && !(Array.isArray(x.team) && x.team.every(t => t && Number.isInteger(t.j) && t.j >= 0 && t.j < 4 && okMains(t.mains) && okStats(t.subs)))) return false;
        out.push({ r: rows[j], res, q, x,
          mains: x.mains ? { sands: x.mains.sands, goblet: x.mains.goblet, circlet: x.mains.circlet } : null,
          subs: x.subs ? Object.assign({}, x.subs) : null });
      }
      out.forEach(({ r, res, q, x, mains, subs }) => {
        r.res = res; r.q = q; r.quickOnly = !!x.qo; r.hidden = !!x.h && !r.cur; r.altRot = !!x.alt;
        if (mains) r.st.members[i].mains = mains;
        if (subs) r.st.members[i].subs = subs;
        let p = r.patch;
        if (x.pp && mains && subs) p = Object.assign({}, p, { mains: clone(mains), subs: clone(subs), subsSrc: 'auto' });
        if (x.low) p = Object.assign({}, p, { __adaptLow: true });
        if (x.team && x.team.length) p = Object.assign({}, p, { __team: x.team.map(t => ({ j: t.j,
          mains: { sands: t.mains.sands, goblet: t.mains.goblet, circlet: t.mains.circlet }, subs: Object.assign({}, t.subs) })) });
        PATCH[r.pid] = p;
      });
      return true;
    },
    async put(k, rows, i) {
      try {
        const d = await db(); if (!d) return;
        const body = { at: Date.now(), rows: rows.map(r => {
          const p = PATCH[r.pid] || {}, m = r.st.members[i];
          return { res: pick(r.res, i), q: pick(r.q, i), qo: !!r.quickOnly, h: !!r.hidden, alt: !!r.altRot,
            mains: m.mains ? { sands: m.mains.sands, goblet: m.mains.goblet, circlet: m.mains.circlet } : null,
            subs: m.subs || null, pp: p !== r.patch && p.subsSrc === 'auto', low: !!p.__adaptLow,
            team: p.__team ? p.__team.map(t => ({ j: t.j, mains: { sands: t.mains.sands, goblet: t.mains.goblet, circlet: t.mains.circlet }, subs: t.subs })) : null };
        }) };
        await d.doc('ranks/' + k).set(body);
      } catch (e) { console.warn('순위표 저장 실패', e && (e.code || e.message)); }
    },
  };
})();
window.rerank = () => { const a = window._rankArgs; if (a) rankRun(a[0], a[1], a[2], a[3], a[4], Object.assign({}, a[5], { noCache: true })); };
async function rankRun(i, cands, title, sub, cols, opts) {
  opts = opts || {};
  window._rankArgs = [i, cands, title, sub, cols, opts];
  approveCalc();   // 순위를 여는 것은 지금 설정으로 계산하겠다는 뜻
  const token = {}; window._rank = token;
  GCPOOL.cancelQueued('rank');
  if (needFit(state) || fit.running) {
    modal(title, '주옵션·부옵션 맞추는 중… 끝나면 순위를 계산합니다', '');
    await fitReady();
    if (window._rank !== token) return;
    render();
  }
  PATCH.length = 0;
  const baseKey = gcslOf(state);
  // 후보마다 이 캐릭터의 주옵션·부옵션을 다시 맞춘 뒤 비교 (자동 최적화를 쓰는 캐릭터일 때)
  const refit = state.autoER !== false && isAuto(state.members[i]);
  // 자동 선택(KQM ↔ 자동 조립)은 장비마다 달라질 수 있어, 순위 계산 중에는 지금 로테이션으로 고정해 같은 사이클로 비교한다

    '운명의 자리 효과는 gcsim이 모두 계산합니다. 윗 단계는 아랫 단계와 똑같이 칠 수도 있으므로, 더 낮게 나오면 손해가 아니라 <b>로테이션을 그 단계에 맞게 바꿔야 한다는 뜻</b>으로 보고 증감을 0%로 표시합니다. ' + rankSub(),
    [['단계', x => x.n === 0 ? '명함' : x.n + '돌']], { monotone: true, altRotation: true, kind: 'cons' });
};
window.showDetail = (i) => {
  const r = last.res; if (!r) return;
  const m = state.members[i], per = r.per[i], Dd = r.duration && isFinite_(rotationOf(state).text) ? r.duration : state.duration;
  const rows = (r.sources[i] || []).map(x => `<tr><td>${esc(x.name)}</td><td class="n">${x.count.toFixed(1)}</td>
    <td class="n">${fmt(x.count ? x.dps * Dd / x.count : 0)}</td><td class="n">${fmt(x.dps)}</td><td class="n">${pc(per ? x.dps / per : 0)}</td></tr>`).join('');
  modal(`${CH[m.gc].ko} — 피해 내역`, `${Dd.toFixed(1)}초 시뮬레이션 ${r.iterations}회 평균. 공격 이름은 gcsim 표기(영문)입니다.`,
    `<table><thead><tr><th>피해</th><th class="n">횟수</th><th class="n">1회 평균</th><th class="n">DPS</th><th class="n">비중</th></tr></thead><tbody>${rows}</tbody></table>`);
};

function footer() {
  return `<div class="foot">
    <b>계산 방식</b><br>
    · 팀 DPS는 <a href="https://github.com/genshinsim/gcsim" target="_blank" rel="noopener">gcsim</a>(AGPL-3.0)을 브라우저 안에서 돌려 계산합니다.
      이 사이트의 gcsim은 캐릭터를 추가·수정한 버전이며, 소스는 <a href="https://github.com/kij00ng/gcsim/tree/site-chars" target="_blank" rel="noopener">여기</a>에 있습니다.
      무기·성유물·특성·운명의 자리 효과, 버프 지속시간, 원소 에너지, 원소 부착·반응을 프레임 단위로 처리합니다.
      치명타는 매 타격 실제로 굴리므로 여러 번 돌린 평균을 씁니다. 시드를 고정해 같은 설정은 항상 같은 숫자가 나옵니다(새 gcsim 파일 기준).<br>
    · 성유물은 KQM 표준입니다: 5성 주옵션, 부옵션 10종 각 2굴림 고정 + 유동 20굴림(한 종류 최대 10, 같은 주옵션 부위마다 2씩 감소), 굴림당 평균값.
      <b>자동 최적화</b>가 켜져 있으면 파티를 바꿀 때마다 주옵션·부옵션을 다시 맞춥니다: 원충은 원소폭발을 기다리지 않을 만큼만,
      나머지 굴림은 같은 시드로 "스탯 +1굴림"마다 팀 DPS가 얼마나 오르는지 재서 덜 오르는 스탯에서 더 오르는 스탯으로 옮기고,
      주옵션도 바꿀 만한 후보를 실제로 바꿔 재 본 뒤 오를 때만 바꿉니다. 무기·세트·운명의 자리·파티원 버프는 gcsim이 계산하므로 자동으로 반영됩니다.<br>
    · 로테이션은 <b>다듬은 프리셋 → KQM DB 설정 → 자동 조립</b> 순으로 고릅니다.
      KQM DB 설정은 <a href="https://db.kqm.gg" target="_blank" rel="noopener">db.kqm.gg</a>에 공유된 gcsim 설정 중, 같은 4명 파티의 가장 최근 것에서 로테이션만 가져온 것입니다${KQM ? ` (${fmt(Object.keys(KQM).length)}개 파티)` : ''}.
      이 사이트의 gcsim으로 실제 돌아가는 것만 넣었습니다. 끝이 있는 로테이션(대부분)은 시간 제한 없이 끝까지 돌리고 그 시간으로 DPS를 냅니다(KQM DB와 같은 방식).
      자동 조립은 원소폭발을 "준비되면 바로, 에너지가 조금 모자라면 최대 2초 기다렸다가" 쓰며, 사람이 최적으로 치는 것보다 낮게 나올 수 있으니 필요하면 직접 편집하세요.<br>
    <b>지원 범위</b><br>
    · 캐릭터 ${D.chars.filter(c => c.gc).length}명 (gcsim 미지원: ${D.chars.filter(c => !c.gc).map(c => c.ko).join(', ')}).
      <b>검토 중</b> 표시(${D.chars.filter(c => c.wip).map(c => c.ko).join(', ')})는 gcsim 원본에 아직 병합되지 않은 구현(커뮤니티 프레임 자료 기반, 리뷰 진행 중)을 가져온 것이라 수치가 바뀔 수 있습니다.
      <b>추정</b> 표시(${D.chars.filter(c => c.est).map(c => c.ko).join(', ')})는 gcsim에 구현이 없어 직접 만든 것입니다. 스킬 수치·자원 규칙은 게임 데이터 그대로지만, 프레임은 유튜브 영상에서 잰 값과 비슷한 캐릭터를 참고한 추정치라 실제와 다를 수 있습니다.
      전용 행동 블록 ${Object.keys(ROT.BLOCKS).length}명, 나머지는 기본 블록.<br>
    · 한국어 명칭: genshin-db 데이터. 캐릭터 그림: 게임 기본 초상화를 <a href="https://enka.network" target="_blank" rel="noopener">enka.network</a>에서 불러옵니다.<br>
    · 원신(Genshin Impact)의 이름과 게임 데이터는 HoYoverse의 것이며, 이 사이트는 HoYoverse·KQM과 관계없는 개인 팬 사이트입니다.
  </div>`;
}

render();
loadKqm();
</script>
